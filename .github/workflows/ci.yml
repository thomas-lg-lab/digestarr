name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "assets/**"
      - ".github/CODEOWNERS"
      - "renovate.json"
  # No paths-ignore here on purpose. The ruleset on main requires
  # image / build, tests and quality; a workflow skipped by path filtering never
  # reports those checks, so they stay pending forever and the PR can never merge.
  # Docs- and asset-only PRs therefore run the full suite, which costs a couple of
  # minutes and confirms they broke nothing.
  pull_request:
    branches: [main]
  # A release published by release-drafter.yml creates its tag with GITHUB_TOKEN, which
  # starts no workflow: that workflow dispatches this one on the tag instead.
  workflow_dispatch:

# A newer push to a PR cancels its run. main and tags never cancel: their run publishes, and
# killing it mid-push could leave a tag without its attestation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-devcontainer:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build devcontainer image
        run: docker build -f .devcontainer/Dockerfile.dev -t digestarr-devcontainer .

      - name: Export image
        run: docker save digestarr-devcontainer | gzip > digestarr-devcontainer.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digestarr-devcontainer
          path: digestarr-devcontainer.tar.gz
          retention-days: 1

  quality:
    needs: build-devcontainer
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digestarr-devcontainer

      - name: Load image
        run: docker load < digestarr-devcontainer.tar.gz

      - name: Run formatting checks (Black)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/app" -w /app digestarr-devcontainer black --check src tests

      - name: Run linting checks (Ruff)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/app" -w /app digestarr-devcontainer ruff check src tests

      - name: Run type checks (mypy)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/app" -w /app -e PYTHONPATH=src digestarr-devcontainer mypy src

      - name: Check lockfiles are up to date
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/app" -w /app digestarr-devcontainer sh -c "
            pip-compile pyproject.toml --output-file requirements.txt --quiet --strip-extras --cache-dir /tmp/.cache &&
            pip-compile pyproject.toml --extra dev --output-file requirements-dev.txt --quiet --strip-extras --cache-dir /tmp/.cache
          "
          if ! git diff --exit-code requirements.txt requirements-dev.txt; then
            echo ""
            echo "::error::Lockfiles are out of sync with requirements files."
            echo "::error::Run './scripts/compile-deps.sh' locally and commit the updated lockfiles."
            exit 1
          fi

      # Each lock preserves its own pins on recompilation, so the step above would not
      # notice the two drifting apart — tests would then run against a different
      # runtime tree than the one the production image ships.
      - name: Check both lockfiles agree on shared packages
        run: |
          pins() { grep -E '^[A-Za-z0-9]' "$1" | sed 's/==/ /' | sort; }
          mismatch=$(join <(pins requirements.txt) <(pins requirements-dev.txt) | awk '$2 != $3')
          if [ -n "$mismatch" ]; then
            echo "::error::requirements.txt and requirements-dev.txt pin different versions of the same package."
            echo "$mismatch" | while read -r name runtime dev; do
              echo "::error::$name: requirements.txt has $runtime, requirements-dev.txt has $dev"
            done
            exit 1
          fi

  tests:
    needs: build-devcontainer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digestarr-devcontainer

      - name: Load image
        run: docker load < digestarr-devcontainer.tar.gz

      - name: Run tests (pytest)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/app" -w /app -e PYTHONPATH=src digestarr-devcontainer pytest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # The image, through the organisation's shared workflow (thomas-lg-lab/.github), once quality
  # and tests passed: build and Trivy gate on PRs, :edge and :sha-<short> from main, :X.Y.Z and
  # :latest from a release tag, build provenance attestation. VERSION receives the image version.
  image:
    needs: [quality, tests]
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
      attestations: write
    uses: thomas-lg-lab/.github/.github/workflows/container-image.yml@21ff202fae4e0f07d7f18b710022abc2d5004f96 # v2.0.0

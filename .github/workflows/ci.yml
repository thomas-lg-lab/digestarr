name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "assets/**"
      - ".github/release-drafter.yml"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/conventional-commit-types.json"
      - "renovate.json"
  # No paths-ignore here on purpose. The ruleset on main requires
  # build-and-push, tests and quality; a workflow skipped by path filtering never
  # reports those checks, so they stay pending forever and the PR can never merge.
  # Docs- and asset-only PRs therefore run the full suite, which costs a couple of
  # minutes and confirms they broke nothing.
  pull_request:
    branches: [main]
  # A release published by draft-release.yml creates its tag with GITHUB_TOKEN, which
  # starts no workflow: that job dispatches this one on the tag instead.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-devcontainer:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Build devcontainer image
        run: docker build -f .devcontainer/Dockerfile.dev -t digestarr-devcontainer .

      - name: Export image
        run: docker save digestarr-devcontainer | gzip > digestarr-devcontainer.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: digestarr-devcontainer
          path: digestarr-devcontainer.tar.gz
          retention-days: 1

  quality:
    needs: build-devcontainer
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: digestarr-devcontainer

      - name: Load image
        run: docker load < digestarr-devcontainer.tar.gz

      - name: Run formatting checks (Black)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/app" -w /app digestarr-devcontainer black --check src tests

      - name: Run linting checks (Ruff)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/app" -w /app digestarr-devcontainer ruff check src tests

      - name: Run type checks (mypy)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/app" -w /app -e PYTHONPATH=src digestarr-devcontainer mypy src

      - name: Check lockfiles are up to date
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/app" -w /app digestarr-devcontainer sh -c "
            pip-compile pyproject.toml --output-file requirements.txt --quiet --strip-extras --cache-dir /tmp/.cache &&
            pip-compile pyproject.toml --extra dev --output-file requirements-dev.txt --quiet --strip-extras --cache-dir /tmp/.cache
          "
          if ! git diff --exit-code requirements.txt requirements-dev.txt; then
            echo ""
            echo "::error::Lockfiles are out of sync with requirements files."
            echo "::error::Run './scripts/compile-deps.sh' locally and commit the updated lockfiles."
            exit 1
          fi

      # Each lock preserves its own pins on recompilation, so the step above would not
      # notice the two drifting apart — tests would then run against a different
      # runtime tree than the one the production image ships.
      - name: Check both lockfiles agree on shared packages
        run: |
          pins() { grep -E '^[A-Za-z0-9]' "$1" | sed 's/==/ /' | sort; }
          mismatch=$(join <(pins requirements.txt) <(pins requirements-dev.txt) | awk '$2 != $3')
          if [ -n "$mismatch" ]; then
            echo "::error::requirements.txt and requirements-dev.txt pin different versions of the same package."
            echo "$mismatch" | while read -r name runtime dev; do
              echo "::error::$name: requirements.txt has $runtime, requirements-dev.txt has $dev"
            done
            exit 1
          fi

  tests:
    needs: build-devcontainer
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: digestarr-devcontainer

      - name: Load image
        run: docker load < digestarr-devcontainer.tar.gz

      - name: Run tests (pytest)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/app" -w /app -e PYTHONPATH=src digestarr-devcontainer pytest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  build-and-push:
    needs: [quality, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Merging is not releasing: main builds 'edge', only a published release
            # (a v* tag) moves 'latest', which is what users pull by default.
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Tag as version for tags like v1.0.0
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Tag as sha-<commit> for traceability on main
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

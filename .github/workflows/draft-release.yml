name: Draft Release

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Dry run (do not publish the release)"
                required: false
                default: "false"
                type: choice
                options:
                    - "false"
                    - "true"

jobs:
    draft-release:
        runs-on: ubuntu-latest
        if: github.event_name == 'push'
        permissions:
            contents: write
            pull-requests: read

        steps:
            - name: Create/Update Draft Release
              uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
              with:
                  config-name: release-drafter.yml
                  token: ${{ secrets.GITHUB_TOKEN }}

    publish-release:
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        permissions:
            contents: write
            pull-requests: read
        outputs:
            tag_name: ${{ steps.drafter.outputs.tag_name }}

        steps:
            - name: Publish Release
              uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
              with:
                  config-name: release-drafter.yml
                  publish: ${{ github.event.inputs.dry_run == 'false' }}
                  token: ${{ secrets.GITHUB_TOKEN }}
              id: drafter

    # The tag the publish created was pushed with GITHUB_TOKEN, which starts no workflow,
    # so ci.yml would never build the release: dispatch it on the tag. A job of its own so
    # that actions: write never sits next to a third-party action.
    dispatch-release-build:
        runs-on: ubuntu-latest
        needs: publish-release
        if: github.event.inputs.dry_run == 'false' && needs.publish-release.outputs.tag_name != ''
        permissions:
            actions: write

        steps:
            - name: Build and push the release image
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.publish-release.outputs.tag_name }}
              run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
